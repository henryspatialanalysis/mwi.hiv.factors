# Community profiles paper (inst/scripts/07_paper_figures.R). Analysis stages:
#  A = GIS indicators only; B = community indicators added; C = expert-vetted profiles.
paper:
  national_covariates_version: '2026-02-16'
  stage_versions:
    A: '2026-02-26-no-cvs'
    B: '2026-02-26'
    C: '2026-03-16'
  # Indicators in the archived stage A run that stages B and C do not use
  stage_a_exclude: ['distance_cross_catchment']
  stage_k:
    Metro: 3
    Non-metro: 5
  # Final profiles in display order (urban to rural), with colors and short labels. Keys
  # match `profile_color` in the vetted groupings; Brown and Grey display as orange and
  # purple, following the May 2026 recolouring.
  profiles:
    Teal: 'Urban seasonal-mobility corridor'
    Pink: 'High-income urban'
    Green: 'Up-and-coming suburban and peri-urban'
    Yellow: 'Peri-urban with mobility and extreme weather'
    Brown: 'Rural border'
    Grey: 'Rural/remote'
  profile_colors:
    Teal: '#00838F'
    Pink: '#D9489A'
    Green: '#5DA02C'
    Yellow: '#E0A800'
    Brown: '#E8590C'
    Grey: '#8064A2'
  excluded_profiles: ['Orange']
  fig1_indicators: [
    'log_population_1km', 'rpi', 'landuse_agriculture', 'landuse_settlements',
    'distance_towns', 'distance_borders'
  ]
  fig3_indicators: [
    'log_population_1km', 'rpi', 'landuse_agriculture', 'distance_towns',
    'distance_borders', 'mobility', 'econ_activity', 'pop_growth', 'weather'
  ]
